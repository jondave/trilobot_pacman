name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: control_scripts/blockly/requirements.txt
      - run: pip install -r control_scripts/blockly/requirements.txt pytest ruff
      - run: ruff check
      - run: pytest
