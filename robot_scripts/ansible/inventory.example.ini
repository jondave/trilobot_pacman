# Copy to inventory.ini (git ignores it), list your robots by IP address and
# set the real users and passwords. No .local/mDNS names: the robots are on
# another VLAN.
#
#   ansible-playbook -i inventory.ini deploy.yml
#
# Password logins over SSH need sshpass on the machine running Ansible
# (sudo apt install sshpass). Never commit inventory.ini with real passwords.
#
# The service runs as each robot's ansible_user unless you set
# trilobot_service_user for that robot or group.

# trilo-01 to trilo-03 share one login, set once in [shared_login:vars].
[shared_login]
trilo-01 ansible_host=10.247.0.101
trilo-02 ansible_host=10.247.0.102
trilo-03 ansible_host=10.247.0.103

[shared_login:vars]
ansible_user=pi
# SSH login password for ansible_user.
ansible_password=CHANGE-ME-SHARED
# sudo password (usually the same as the login password on a Pi).
ansible_become_password=CHANGE-ME-SHARED

# trilo-04 to trilo-06 each have their own user and password, set per line.
[own_login]
trilo-04 ansible_host=10.247.0.104 ansible_user=robot4 ansible_password=CHANGE-ME-04 ansible_become_password=CHANGE-ME-04
trilo-05 ansible_host=10.247.0.105 ansible_user=robot5 ansible_password=CHANGE-ME-05 ansible_become_password=CHANGE-ME-05
trilo-06 ansible_host=10.247.0.106 ansible_user=robot6 ansible_password=CHANGE-ME-06 ansible_become_password=CHANGE-ME-06

# deploy.yml targets every robot in this group.
[trilobots:children]
shared_login
own_login

[trilobots:vars]
# Accept each robot's host key on first connect so password logins don't stall.
ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new'
