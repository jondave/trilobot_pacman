# Clone trilobot_pacman into /opt/trilobot_pacman on each robot and run
# robot_sender.py as trilobot-websocket.service.
#
#   ansible-playbook -i inventory.ini deploy.yml
#
# inventory.ini (copied from inventory.example.ini) holds the robots' IPs and
# their SSH/sudo passwords.
#
# Re-running pulls the latest commit of repo_version, checks the managed and
# Pimoroni environments for Trilobot, installs runtime requirements in the
# selected environment, and restarts the service when needed.
# The Pi camera package and system-level hardware setup must already be present.
- name: Deploy the Trilobot WebSocket server
  hosts: trilobots
  become: true
  vars:
    repo_url: https://github.com/jondave/trilobot_pacman.git
    repo_version: main
    install_dir: /opt/trilobot_pacman
    # Owns the checkout and runs the service: the robot's login user unless
    # trilobot_service_user is set in the inventory.
    service_user: "{{ trilobot_service_user | default(ansible_user) | default('pi', true) }}"
    python: /usr/bin/python3
    venv_dir: "{{ install_dir }}/.venv"
    unit_path: /etc/systemd/system/trilobot-websocket.service

  tasks:
    - name: Install git and Python venv support
      ansible.builtin.apt:
        name:
          - git
          - python3-venv
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create the install folder, owned by the service user
      ansible.builtin.file:
        path: "{{ install_dir }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0755"

    - name: Clone or update the repository
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ install_dir }}"
        version: "{{ repo_version }}"
      become: true
      become_user: "{{ service_user }}"
      notify: Restart trilobot-websocket

    - name: Create the Python virtual environment
      ansible.builtin.command:
        cmd: "{{ python }} -m venv --system-site-packages {{ venv_dir }}"
        creates: "{{ venv_dir }}/bin/python"
      become: true
      become_user: "{{ service_user }}"

    - name: Check whether the managed environment can import Trilobot
      ansible.builtin.command:
        cmd: "{{ venv_dir }}/bin/python -c 'from trilobot import Trilobot'"
      register: managed_trilobot_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ service_user }}"

    - name: Look up the service user's home directory
      ansible.builtin.getent:
        database: passwd
        key: "{{ service_user }}"

    - name: Set the service user's Pimoroni environment path
      ansible.builtin.set_fact:
        pimoroni_python: "{{ getent_passwd[service_user][4] }}/.virtualenvs/pimoroni/bin/python"

    - name: Check whether Pimoroni's environment exists
      ansible.builtin.stat:
        path: "{{ pimoroni_python }}"
      register: pimoroni_python_check

    - name: Check whether Pimoroni's environment can import Trilobot
      ansible.builtin.command:
        cmd: "{{ pimoroni_python }} -c 'from trilobot import Trilobot'"
      register: pimoroni_trilobot_check
      changed_when: false
      failed_when: false
      become: true
      become_user: "{{ service_user }}"
      when: pimoroni_python_check.stat.exists

    - name: Require Trilobot in one of the available environments
      ansible.builtin.assert:
        that:
          - managed_trilobot_check.rc == 0 or (pimoroni_trilobot_check.rc | default(1)) == 0
        fail_msg: >-
          Cannot import Trilobot from either {{ venv_dir }}/bin/python or
          {{ pimoroni_python }}. Follow Pimoroni's installation guide, then
          rerun this playbook.

    - name: Select the Python environment for the service
      ansible.builtin.set_fact:
        service_python: >-
          {{ venv_dir ~ '/bin/python'
             if managed_trilobot_check.rc == 0
             else pimoroni_python }}

    - name: Install robot Python requirements
      ansible.builtin.pip:
        requirements: "{{ install_dir }}/robot_scripts/requirements.txt"
        executable: "{{ service_python | dirname }}/pip"
      become: true
      become_user: "{{ service_user }}"
      notify: Restart trilobot-websocket

    - name: Read the unit template from the checkout
      ansible.builtin.slurp:
        src: "{{ install_dir }}/robot_scripts/trilobot-websocket.service"
      register: unit_template

    - name: Install trilobot-websocket.service
      ansible.builtin.copy:
        dest: "{{ unit_path }}"
        owner: root
        group: root
        mode: "0644"
        content: >-
          {{ unit_template.content | b64decode
             | replace('@USER@', service_user)
             | replace('@ROBOT_SCRIPTS@', install_dir ~ '/robot_scripts')
             | replace('@PYTHON@', service_python) }}
      notify: Restart trilobot-websocket

    - name: Check for the old trilobot-robot.service
      ansible.builtin.stat:
        path: /etc/systemd/system/trilobot-robot.service
      register: old_unit

    - name: Stop and disable the old trilobot-robot.service
      ansible.builtin.systemd:
        name: trilobot-robot.service
        state: stopped
        enabled: false
      when: old_unit.stat.exists

    - name: Remove the old trilobot-robot.service
      ansible.builtin.file:
        path: /etc/systemd/system/trilobot-robot.service
        state: absent

    - name: Enable and start trilobot-websocket.service
      ansible.builtin.systemd:
        name: trilobot-websocket.service
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart trilobot-websocket
      ansible.builtin.systemd:
        name: trilobot-websocket.service
        state: restarted
        daemon_reload: true
