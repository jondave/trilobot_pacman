[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.ruff]
target-version = "py312"
line-length = 88
# Demos are student scripts run inside an injected namespace.
extend-exclude = [".venv", "control_scripts/blockly/demos"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"control_scripts/teleop_example.py" = ["I001"]
"robot_scripts/robot_sender.py" = ["I001"]
"robot_scripts/**" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
